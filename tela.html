<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerdeVida</title>
<link rel="stylesheet" href="tela.css">
</head>
<body>
 
    <!-- Cabeçalho com barra de pesquisa -->
<header>

  

    <div class="header">   
             <div class="titulo">
                <h1>VerdeVida</h1>
            </div>

        <div class="telas">
                 <button type="button">Início</button>
                 <button type="button">Plantas</button>
                 <button type="button">Sobre</button>
                 <button type="button">contato</button>
        
        </div>

        <div class="icones">
            <article class="carrinho">
                <img
                                src="carrinho.jpg";
                                alt="carrinho"
                                class="carrinho"
            >
             <button type="button">carrinho</button>
        </div>

    </div>
</header>

<article class="plantas">

    <div class="texto"> 
         <h2>Traga mais vida para sua casa</h2>

          <p>Plantas deixam o ambiente mais bonito, saúdavel e cheio de energia.</p>
          <button type="button">🌿 ver plantas</button>
    </div> 
    <img
                    src="plantas.jpg";
                    alt="abertura"
                    class="plantas"
                    >
</article>  

<main>
    <h3>Nossas plantas</h3>
     
            <section class="plant" aria-label="Plantas disponíveis">
     
                <!-- Primeiro produto -->
    <article class="planta">
    <img
                        src="jiboia.jpg";
                        alt="jiboia"
                        class="imagem-produto"
    >
    <h4>Jiboia</h4>
    <p>Planta resistente e fácil de cuidar.</p>
    <h5 class="preco">R$ 25,90</h5>
    <button type="button">Comprar</button>
    </article>
     
                <!-- Segundo produto -->
    <article class="planta">
    <img
                        src="suculenta.jpg";
                        alt="suculenta"
                        class="imagem-produto"
    >
    <h4>Suculenta</h4>
    <p>Perfeita para decorar qualquer espaço.</p>
    <h5 class="preco">R$ 15,90</h5>
    <button type="button">Comprar</button>
    </article>
     
                <!-- Terceiro produto -->
    <article class="planta">
    <img
                        src="cacto.jpg";
                        alt="cacto"
                        class="imagem-produto"
    >
    <h4>Cacto</h4>
    <p>ideal para ambientes com sol.</p>
    <h5 class="preco">R$ 18,90</h5>
    <button type="button">Comprar</button>
    </article>
     
            </section>
    </main>

</body>
</html>
